[package]
name = "libglass"
version = "0.1.0"
edition = "2021"
description = "Glass - a distributed computing library (Rust port of the C++ libGlass)"
license = "LGPL-2.0-or-later"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
bincode = { version = "1", optional = true }
log = "0.4"
memmap2 = "0.9"
serde = { version = "1", optional = true }

[target.'cfg(unix)'.dependencies]
socket2 = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[features]
# Adds `Serde<T>`, to send any type that implements serde's traits.
serde = ["dep:serde", "dep:bincode"]

[dev-dependencies]
glow = "0.18"
glutin = "0.32"
glutin-winit = "0.5"
serde = { version = "1", features = ["derive"] }
winit = "0.30"

[[example]]
name = "render_wall"
path = "examples/render_wall/main.rs"
# Its synchronization has tests, which do not open any window.
test = true

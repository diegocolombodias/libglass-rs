<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 830" width="1040" height="830" role="img" aria-labelledby="title desc" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="title">Arquitetura da libglass</title>
  <desc id="desc">Cada nó tem um GlassClient com objetos distribuídos, que troca pacotes por TCP, Unix socket ou UDP com um GlassServer. No servidor, threads de leitura colocam os pacotes em uma fila, e uma única thread dispatcher os entrega aos plugins e envia as respostas. Servidores se ligam a peers do mesmo grupo e a gateways de outros grupos.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font-size: 15px; font-weight: 600; fill: #0f172a; }
      .name { font-size: 13.5px; font-weight: 600; fill: #0f172a; text-anchor: middle; }
      .sub { font-size: 12px; fill: #475569; text-anchor: middle; }
      .note { font-size: 13px; fill: #334155; }
      .label { font-size: 12px; fill: #334155; text-anchor: middle; }
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1; }
      .app { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1; }
      .client { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; }
      .server { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.5; }
      .dispatcher { fill: #d1fae5; stroke: #10b981; stroke-width: 1; }
      .other { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 5 4; }
      .line { fill: none; stroke: #475569; stroke-width: 1.5; }
      .dashed { stroke-dasharray: 6 4; }
    </style>
  </defs>

  <rect width="1040" height="830" fill="#ffffff"/>

  <!-- Applications -->
  <rect class="app" x="30" y="20" width="320" height="52" rx="6"/>
  <text class="name" x="190" y="42">Aplicação em C ou Python</text>
  <text class="sub" x="190" y="60">pela API em C (include/libglass.h)</text>
  <rect class="app" x="370" y="20" width="320" height="52" rx="6"/>
  <text class="name" x="530" y="42">Aplicação em Rust</text>
  <text class="sub" x="530" y="60">usa os objetos diretamente</text>
  <path class="line" marker-end="url(#arrow)" d="M190 72 V100"/>
  <path class="line" marker-end="url(#arrow)" d="M530 72 V100"/>

  <rect class="app" x="720" y="20" width="290" height="52" rx="6"/>
  <text class="name" x="865" y="42">SharedRegion</text>
  <text class="sub" x="865" y="60">memória na mesma máquina, sem rede</text>
  <path class="line" marker-end="url(#arrow)" d="M690 46 H720"/>

  <!-- Client -->
  <rect class="client" x="30" y="100" width="660" height="240" rx="8"/>
  <text class="title" x="46" y="124">GlassClient: um em cada nó</text>

  <g>
    <rect class="box" x="46" y="136" width="98" height="32" rx="4"/><text class="name" x="95" y="157">Event</text>
    <rect class="box" x="150" y="136" width="98" height="32" rx="4"/><text class="name" x="199" y="157">Messenger</text>
    <rect class="box" x="254" y="136" width="98" height="32" rx="4"/><text class="name" x="303" y="157">Shared</text>
    <rect class="box" x="358" y="136" width="98" height="32" rx="4"/><text class="name" x="407" y="157">Remote</text>
    <rect class="box" x="462" y="136" width="98" height="32" rx="4"/><text class="name" x="511" y="157">Barrier</text>
    <rect class="box" x="566" y="136" width="98" height="32" rx="4"/><text class="name" x="615" y="157">Alias</text>
    <rect class="box" x="46" y="174" width="305" height="28" rx="4"/><text class="sub" x="198" y="193">EventSerializable, construído sobre Event</text>
    <rect class="box" x="359" y="174" width="305" height="28" rx="4"/><text class="sub" x="511" y="193">Stream, construído sobre Messenger</text>
  </g>

  <rect class="box" x="46" y="212" width="618" height="32" rx="4"/>
  <text class="name" x="355" y="233">Estado do cliente, protegido por um Mutex e um Condvar</text>

  <path class="line" marker-end="url(#arrow)" d="M141 244 V268"/>
  <path class="line" marker-start="url(#arrow)" d="M349 244 V268"/>
  <path class="line" marker-start="url(#arrow)" d="M563 244 V268"/>

  <rect class="box" x="46" y="268" width="190" height="56" rx="4"/>
  <text class="name" x="141" y="291">Envio</text>
  <text class="sub" x="141" y="309">pacotes para o servidor</text>
  <rect class="box" x="254" y="268" width="190" height="56" rx="4"/>
  <text class="name" x="349" y="291">Thread UDP</text>
  <text class="sub" x="349" y="309">opcional</text>
  <rect class="box" x="462" y="268" width="202" height="56" rx="4"/>
  <text class="name" x="563" y="291">Thread de leitura</text>
  <text class="sub" x="563" y="309">guarda ou entrega o que chega</text>

  <!-- Server -->
  <rect class="server" x="30" y="450" width="660" height="360" rx="8"/>
  <text class="title" x="46" y="474">GlassServer</text>

  <rect class="box" x="46" y="486" width="190" height="56" rx="4"/>
  <text class="name" x="141" y="509">Threads de leitura</text>
  <text class="sub" x="141" y="527">uma por conexão</text>
  <rect class="box" x="254" y="486" width="190" height="56" rx="4"/>
  <text class="name" x="349" y="509">Thread UDP</text>
  <text class="sub" x="349" y="527">opcional</text>
  <rect class="box" x="462" y="486" width="202" height="56" rx="4"/>
  <text class="name" x="563" y="509">Envio</text>
  <text class="sub" x="563" y="527">para clientes e servidores</text>

  <path class="line" marker-end="url(#arrow)" d="M141 542 V564"/>
  <path class="line" marker-end="url(#arrow)" d="M349 542 V564"/>

  <rect class="box" x="46" y="564" width="398" height="44" rx="4"/>
  <text class="name" x="245" y="591">Fila única: tudo o que chega, em ordem</text>

  <path class="line" marker-end="url(#arrow)" d="M245 608 V634"/>
  <path class="line" marker-end="url(#arrow)" d="M563 634 V542"/>

  <rect class="dispatcher" x="46" y="634" width="618" height="160" rx="6"/>
  <text class="name" x="355" y="658">Thread dispatcher: a única dona do estado dos plugins</text>
  <g>
    <rect class="box" x="60" y="670" width="140" height="32" rx="4"/><text class="name" x="130" y="691">Root</text>
    <rect class="box" x="208" y="670" width="140" height="32" rx="4"/><text class="name" x="278" y="691">Alias</text>
    <rect class="box" x="356" y="670" width="140" height="32" rx="4"/><text class="name" x="426" y="691">Barrier</text>
    <rect class="box" x="504" y="670" width="146" height="32" rx="4"/><text class="name" x="577" y="691">Shared</text>
    <rect class="box" x="60" y="710" width="140" height="32" rx="4"/><text class="name" x="130" y="731">Event</text>
    <rect class="box" x="208" y="710" width="140" height="32" rx="4"/><text class="name" x="278" y="731">Remote</text>
    <rect class="box" x="356" y="710" width="140" height="32" rx="4"/><text class="name" x="426" y="731">Messenger</text>
    <rect class="box" x="504" y="710" width="146" height="32" rx="4"/><text class="name" x="577" y="731">Seus plugins</text>
  </g>
  <text class="sub" x="355" y="772">Cada objeto do cliente conversa com o plugin de mesmo nome no servidor</text>

  <!-- Transports -->
  <path class="line" marker-end="url(#arrow)" d="M141 324 V486"/>
  <path class="line dashed" marker-start="url(#arrow)" marker-end="url(#arrow)" d="M349 324 V486"/>
  <path class="line" marker-end="url(#arrow)" d="M563 486 V324"/>
  <rect x="71" y="395" width="140" height="22" fill="#ffffff"/>
  <text class="label" x="141" y="410">TCP ou Unix socket</text>
  <rect x="274" y="387" width="150" height="38" fill="#ffffff"/>
  <text class="label" x="349" y="402">UDP: mais rápido,</text>
  <text class="label" x="349" y="418">pode perder pacotes</text>
  <rect x="493" y="395" width="140" height="22" fill="#ffffff"/>
  <text class="label" x="563" y="410">TCP ou Unix socket</text>

  <!-- Other servers -->
  <rect x="720" y="100" width="290" height="240" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="title" x="736" y="124">O que cruza servidores</text>
  <text class="note" x="736" y="150">Só objetos criados com Mode::Global.</text>
  <text class="note" x="736" y="184" font-weight="600">Para onde cada pacote segue:</text>
  <text class="note" x="736" y="208">De um cliente: peers e gateways</text>
  <text class="note" x="736" y="232">De um peer: gateways</text>
  <text class="note" x="736" y="256">De um gateway: peers</text>
  <text class="note" x="736" y="290">Cada nível só repassa ao outro,</text>
  <text class="note" x="736" y="310">então os pacotes não dão voltas.</text>

  <rect class="other" x="720" y="450" width="290" height="160" rx="8"/>
  <text class="title" x="736" y="474">Mesmo grupo</text>
  <rect class="box" x="736" y="486" width="258" height="44" rx="4"/>
  <text class="name" x="865" y="513">GlassServer peer</text>
  <path class="line" marker-start="url(#arrow)" marker-end="url(#arrow)" d="M865 530 V552"/>
  <rect class="box" x="736" y="552" width="258" height="44" rx="4"/>
  <text class="name" x="865" y="579">Os clientes dele</text>

  <rect class="other" x="720" y="634" width="290" height="176" rx="8"/>
  <text class="title" x="736" y="658">Outro grupo</text>
  <rect class="box" x="736" y="670" width="258" height="44" rx="4"/>
  <text class="name" x="865" y="697">GlassServer gateway</text>
  <path class="line" marker-start="url(#arrow)" marker-end="url(#arrow)" d="M865 714 V736"/>
  <rect class="box" x="736" y="736" width="258" height="44" rx="4"/>
  <text class="name" x="865" y="763">Os peers e clientes dele</text>

  <path class="line" marker-start="url(#arrow)" marker-end="url(#arrow)" d="M690 508 H736"/>
  <path class="line" marker-start="url(#arrow)" marker-end="url(#arrow)" d="M690 692 H736"/>
</svg>

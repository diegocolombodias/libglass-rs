    <rect class="item" x="404" y="452" width="152" height="52" rx="4"/>
    <text class="center" x="480" y="474">Data</text>
    <text class="center" x="480" y="492">Streams</text>
    <rect class="item" x="570" y="452" width="152" height="52" rx="4"/>
    <text class="center" x="646" y="474">Serializable</text>
    <text class="center" x="646" y="492">Events</text>

    <rect class="item" x="404" y="518" width="152" height="52" rx="4"/>
    <text class="center" x="480" y="540">Shared</text>
    <text class="center" x="480" y="558">Memory</text>
    <rect class="item" x="570" y="518" width="152" height="52" rx="4"/>
    <text class="center" x="646" y="540">Custom</text>
    <text class="center" x="646" y="558">Plugins</text>
  </g>

  <!-- Legend -->
  <rect class="new" x="12" y="620" width="22" height="16" rx="3"/>
  <text x="44" y="633" font-size="14">New in the Rust version</text>
</svg>

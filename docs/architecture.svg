<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 830" width="1040" height="830" role="img" aria-labelledby="title desc" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="title">Architecture of libglass</title>
  <desc id="desc">Each node has a GlassClient with distributed objects, which exchanges packets with a GlassServer through TCP, SCTP, QUIC, Unix sockets or UDP. A client sends in the thread of the caller. In the server, reading threads put the packets in a queue, and a single dispatcher thread hands them to the plugins; each connection has a queue and a thread that writes to it. A peer links to the peers of its group, and a gateway also to the gateways of other groups.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font-size: 15px; font-weight: 600; fill: #0f172a; }
      .name { font-size: 13.5px; font-weight: 600; fill: #0f172a; text-anchor: middle; }
      .sub { font-size: 12px; fill: #475569; text-anchor: middle; }
      .note { font-size: 13px; fill: #334155; }
      .label { font-size: 12px; fill: #334155; text-anchor: middle; }
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1; }
      .app { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1; }
      .client { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; }
      .server { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.5; }
      .dispatcher { fill: #d1fae5; stroke: #10b981; stroke-width: 1; }
      .other { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 5 4; }
      .line { fill: none; stroke: #475569; stroke-width: 1.5; }
      .dashed { stroke-dasharray: 6 4; }
    </style>
  </defs>

  <rect width="1040" height="830" fill="#ffffff"/>

  <!-- Applications -->
  <rect class="app" x="30" y="20" width="320" height="52" rx="6"/>
  <text class="name" x="190" y="42">Application in C or Python</text>
  <text class="sub" x="190" y="60">through the C API, without Stream or EventSerializable</text>
  <rect class="app" x="370" y="20" width="320" height="52" rx="6"/>
  <text class="name" x="530" y="42">Application in Rust</text>
  <text class="sub" x="530" y="60">uses the objects directly</text>
  <path class="line" marker-end="url(#arrow)" d="M190 72 V100"/>
  <path class="line" marker-end="url(#arrow)" d="M530 72 V100"/>

  <rect class="app" x="720" y="20" width="290" height="52" rx="6"/>
  <text class="name" x="865" y="42">SharedRegion</text>
  <text class="sub" x="865" y="60">memory on the same machine, no network</text>
  <path class="line" marker-end="url(#arrow)" d="M690 46 H720"/>

  <!-- Client -->
  <rect class="client" x="30" y="100" width="660" height="240" rx="8"/>
  <text class="title" x="46" y="124">GlassClient: one in each node</text>

  <g>
    <rect class="box" x="46" y="136" width="98" height="32" rx="4"/><text class="name" x="95" y="157">Event</text>
    <rect class="box" x="150" y="136" width="98" height="32" rx="4"/><text class="name" x="199" y="157">Messenger</text>
    <rect class="box" x="254" y="136" width="98" height="32" rx="4"/><text class="name" x="303" y="157">Shared</text>
    <rect class="box" x="358" y="136" width="98" height="32" rx="4"/><text class="name" x="407" y="157">Remote</text>
    <rect class="box" x="462" y="136" width="98" height="32" rx="4"/><text class="name" x="511" y="157">Barrier</text>
    <rect class="box" x="566" y="136" width="98" height="32" rx="4"/><text class="name" x="615" y="157">Alias</text>
    <rect class="box" x="46" y="174" width="305" height="28" rx="4"/><text class="sub" x="198" y="193">EventSerializable, built on Event</text>
    <rect class="box" x="359" y="174" width="305" height="28" rx="4"/><text class="sub" x="511" y="193">Stream, built on Messenger</text>
  </g>

  <rect class="box" x="254" y="226" width="410" height="32" rx="4"/>
  <text class="name" x="459" y="247">State of the client, with a Mutex and a Condvar</text>

  <path class="line" marker-end="url(#arrow)" d="M141 202 V226"/>
  <path class="line" marker-end="url(#arrow)" d="M459 226 V202"/>
  <path class="line" marker-end="url(#arrow)" d="M349 278 V258"/>
  <path class="line" marker-end="url(#arrow)" d="M563 278 V258"/>

  <rect class="box" x="46" y="226" width="190" height="98" rx="4"/>
  <text class="name" x="141" y="268">Sending</text>
  <text class="sub" x="141" y="286">in the thread of the caller</text>
  <rect class="box" x="254" y="278" width="190" height="46" rx="4"/>
  <text class="name" x="349" y="297">UDP</text>
  <text class="sub" x="349" y="314">optional; a thread reads</text>
  <rect class="box" x="462" y="278" width="202" height="46" rx="4"/>
  <text class="name" x="563" y="297">Reading thread</text>
  <text class="sub" x="563" y="314">keeps or delivers what arrives</text>

  <!-- Server -->
  <rect class="server" x="30" y="450" width="660" height="360" rx="8"/>
  <text class="title" x="46" y="474">GlassServer</text>

  <rect class="box" x="46" y="486" width="190" height="56" rx="4"/>
  <text class="name" x="141" y="509">Reading threads</text>
  <text class="sub" x="141" y="527">one per connection</text>
  <rect class="box" x="254" y="486" width="190" height="56" rx="4"/>
  <text class="name" x="349" y="509">UDP</text>
  <text class="sub" x="349" y="527">optional; a thread reads</text>
  <rect class="box" x="462" y="486" width="202" height="56" rx="4"/>
  <text class="name" x="563" y="509">Sending</text>
  <text class="sub" x="563" y="527">queue + thread per connection</text>

  <path class="line" marker-end="url(#arrow)" d="M141 542 V564"/>
  <path class="line" marker-end="url(#arrow)" d="M349 542 V564"/>

  <rect class="box" x="46" y="564" width="398" height="44" rx="4"/>
  <text class="name" x="245" y="591">Single queue: everything that arrives, in order</text>

  <path class="line" marker-end="url(#arrow)" d="M245 608 V634"/>
  <path class="line" marker-end="url(#arrow)" d="M563 634 V542"/>

  <rect class="dispatcher" x="46" y="634" width="618" height="160" rx="6"/>
  <text class="name" x="355" y="658">Dispatcher thread: the only owner of the state of the plugins</text>
  <g>
    <rect class="box" x="60" y="670" width="140" height="32" rx="4"/><text class="name" x="130" y="691">Root</text>
    <rect class="box" x="208" y="670" width="140" height="32" rx="4"/><text class="name" x="278" y="691">Alias</text>
    <rect class="box" x="356" y="670" width="140" height="32" rx="4"/><text class="name" x="426" y="691">Barrier</text>
    <rect class="box" x="504" y="670" width="146" height="32" rx="4"/><text class="name" x="577" y="691">Shared</text>
    <rect class="box" x="60" y="710" width="140" height="32" rx="4"/><text class="name" x="130" y="731">Event</text>
    <rect class="box" x="208" y="710" width="140" height="32" rx="4"/><text class="name" x="278" y="731">Remote</text>
    <rect class="box" x="356" y="710" width="140" height="32" rx="4"/><text class="name" x="426" y="731">Messenger</text>
    <rect class="box" x="504" y="710" width="146" height="32" rx="4"/><text class="name" x="577" y="731">Your plugins</text>
  </g>
  <text class="sub" x="355" y="772">Each object of a client talks to the plugin of the same name in the server</text>

  <!-- Transports -->
  <path class="line" marker-end="url(#arrow)" d="M141 324 V486"/>
  <path class="line dashed" marker-start="url(#arrow)" marker-end="url(#arrow)" d="M349 324 V486"/>
  <path class="line" marker-end="url(#arrow)" d="M563 486 V324"/>
  <rect x="36" y="395" width="210" height="22" fill="#ffffff"/>
  <text class="label" x="141" y="410">TCP, SCTP, QUIC or Unix socket</text>
  <rect x="274" y="387" width="150" height="38" fill="#ffffff"/>
  <text class="label" x="349" y="402">UDP: faster,</text>
  <text class="label" x="349" y="418">may lose packets</text>
  <rect x="458" y="395" width="210" height="22" fill="#ffffff"/>
  <text class="label" x="563" y="410">TCP, SCTP, QUIC or Unix socket</text>

  <!-- Other servers -->
  <rect x="720" y="100" width="290" height="240" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="title" x="736" y="124">What crosses servers</text>
  <text class="note" x="736" y="146">Objects with Mode::Global, control</text>
  <text class="note" x="736" y="164">messages, and plugins that ask to.</text>
  <text class="note" x="736" y="190" font-weight="600">Which servers each packet goes to:</text>
  <text class="note" x="736" y="212">From a client: peers and gateways</text>
  <text class="note" x="736" y="232">From a peer: gateways</text>
  <text class="note" x="736" y="252">From a gateway: peers</text>
  <text class="note" x="736" y="280">Each level only forwards to the other,</text>
  <text class="note" x="736" y="298">so packets do not go in circles.</text>
  <text class="note" x="736" y="324">Between servers: TCP, SCTP or QUIC.</text>

  <rect class="other" x="720" y="450" width="290" height="160" rx="8"/>
  <text class="title" x="736" y="474">Same group, if it is a peer</text>
  <rect class="box" x="736" y="486" width="258" height="40" rx="4"/>
  <text class="name" x="865" y="511">GlassServer peer</text>
  <path class="line" marker-start="url(#arrow)" marker-end="url(#arrow)" d="M865 526 V556"/>
  <rect class="box" x="736" y="556" width="258" height="40" rx="4"/>
  <text class="name" x="865" y="581">Its clients</text>

  <rect class="other" x="720" y="634" width="290" height="176" rx="8"/>
  <text class="title" x="736" y="658">Other group, if it is a gateway</text>
  <rect class="box" x="736" y="670" width="258" height="40" rx="4"/>
  <text class="name" x="865" y="695">GlassServer gateway</text>
  <path class="line" marker-start="url(#arrow)" marker-end="url(#arrow)" d="M865 710 V740"/>
  <rect class="box" x="736" y="740" width="258" height="40" rx="4"/>
  <text class="name" x="865" y="765">Its peers and clients</text>

  <path class="line" marker-start="url(#arrow)" marker-end="url(#arrow)" d="M690 508 H736"/>
  <path class="line" marker-start="url(#arrow)" marker-end="url(#arrow)" d="M690 692 H736"/>
</svg>
